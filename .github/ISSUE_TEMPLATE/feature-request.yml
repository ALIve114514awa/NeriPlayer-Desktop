name: Feature request / 功能请求
description: 提议一项明确的新功能 / Propose a specific new capability
title: "[Feature] "
labels: ["enhancement"]

body:
  - type: markdown
    attributes:
      value: |
        感谢你为 NeriPlayer Desktop 提出新功能建议
        请重点说明要解决的问题，而不只是描述一个实现方式

        Thank you for proposing a feature for NeriPlayer Desktop
        Please focus on the problem to solve, not only one possible implementation

  - type: textarea
    id: motivation
    attributes:
      label: 功能背景与需求 / Motivation
      description: 说明当前遇到的限制、使用场景和目标用户 / Describe the current limitation, use case, and target users
    validations:
      required: true

  - type: textarea
    id: proposed-feature
    attributes:
      label: 期望的功能 / Proposed feature
      description: 描述期望的行为和完成标准 / Describe the expected behavior and acceptance criteria
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 可选方案 / Alternatives considered
      description: 说明尝试过的替代方案或当前临时解决方式 / Describe alternatives or current workarounds
    validations:
      required: false

  - type: dropdown
    id: target-platforms
    attributes:
      label: 目标平台 / Target platforms
      multiple: true
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true

  - type: textarea
    id: android-relationship
    attributes:
      label: 与 Android 版本的关系 / Relationship with the Android app
      description: 说明 Android 端是否已有类似功能，或是否需要跨端协议兼容 / Note whether Android has a similar feature or cross-platform protocol compatibility is needed
    validations:
      required: false

  - type: textarea
    id: additional-information
    attributes:
      label: 补充材料 / Additional context
      description: 可附参考产品、设计草图、截图或相关 Issue / Add references, mockups, screenshots, or related issues
    validations:
      required: false

  - type: checkboxes
    id: confirmation
    attributes:
      label: 提交前确认 / Confirmation
      options:
        - label: 我已搜索 [Issue Tracker](https://github.com/cwuom/NeriPlayer-Desktop/issues)，没有发现相同或高度相似的请求 / I searched the Issue Tracker and found no duplicate request
          required: true
        - label: 我已说明此功能要解决的实际问题和使用场景 / I described the actual problem and use case this feature would address
          required: true
