<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NeriPlayer</title>
    <script src="/theme-init.js"></script>
    <style>
      /* 本地字体 — 零网络依赖 */
      @font-face {
        font-family: 'Material Symbols Rounded';
        font-style: normal;
        font-weight: 100 700;
        font-display: block;
        src: url(/fonts/MaterialSymbolsRounded.woff2) format('woff2');
      }
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url(/fonts/Inter-Variable.woff2) format('woff2');
      }
      @font-face {
        font-family: 'MiSans';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url(/fonts/MiSans-Regular.woff2) format('woff2');
      }
      @font-face {
        font-family: 'MiSans';
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url(/fonts/MiSans-Medium.woff2) format('woff2');
      }
      @font-face {
        font-family: 'MiSans';
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src: url(/fonts/MiSans-Semibold.woff2) format('woff2');
      }
      @font-face {
        font-family: 'MiSans';
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url(/fonts/MiSans-Bold.woff2) format('woff2');
      }
      html, body {
        margin: 0;
        overflow: hidden;
      }
      /* 图标字体基础声明 */
      .material-symbols-rounded {
        font-family: 'Material Symbols Rounded';
        font-weight: normal;
        font-style: normal;
        font-size: 24px;
        line-height: 1;
        letter-spacing: normal;
        text-transform: none;
        display: inline-block;
        white-space: nowrap;
        word-wrap: normal;
        direction: ltr;
        -webkit-font-smoothing: antialiased;
        font-feature-settings: 'liga';
        vertical-align: middle;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
